name: dlg_q
description: "DIY 多邻国学习APP - 用户自定义题库 + AI拆题"
publish_to: 'none'
version: 1.1.0+8

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  sqflite: ^2.4.1
  path_provider: ^2.1.4
  path: ^1.9.0
  dio: ^5.7.0
  receive_sharing_intent: ^1.8.1
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  shared_preferences: ^2.3.2
  cached_network_image: ^3.4.1
  file_picker: ^11.0.0
  image_picker: ^1.1.2
  http: ^1.2.0
  mime: ^2.0.0
  # B站扫码登录二维码渲染（纯Dart，全平台可用）
  qr_flutter: ^4.1.0
  # B站 cookie 自动续期：RSA-OAEP(SHA-256) 生成 correspondPath（纯Dart）
  pointycastle: ^3.9.1
  # Web/桌面端 SQLite（Android 仍用原生 sqflite）
  sqflite_common_ffi: ^2.3.3
  sqflite_common_ffi_web: ^1.0.0

# 本地补丁版 file_picker：原版引用的 FlutterLifecycleAdapter 在 Flutter 3.32
# 引擎中已移除导致编译失败，此处改为 ActivityPluginBinding.getLifecycle()。
dependency_overrides:
  file_picker:
    path: third_party/file_picker

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
