name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN 需要写权限才能自动创建 Release
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: 解码发布签名密钥（固定签名，保证覆盖安装）
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/duoduo-release.jks
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - name: Build APK（版本号随构建次数自动递增）
        env:
          KEYSTORE_FILE: /tmp/duoduo-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --build-name=1.1.${{ github.run_number }} --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-multimodal-${{ github.run_number }}
          name: "多多多模态版 v1.0-${{ github.run_number }}"
          body: |
            多模态纯云端版
            - 截图/拍照多选、PDF/Word原文件直传(MiMo-V2.5)
            - 链接抓取
            - 问答题 AI对错+点评
            安装 app-release.apk 即可
          files: build/app/outputs/flutter-apk/app-release.apk
